services:
  gitlab:
    image: gitlab/gitlab-ee:your_gitlab_version
    #Use version from your backup 
    #Example: gitlab/gitlab-ee:18.4.5-ee
    container_name: gitlab
    restart: always
    hostname: 'your.domain.com' #Only domain name, without "http://""
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://your.domain.com' #Use "http://" because SSL is generated by reverse proxy
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
    ports:
      - '8080:80'
      - '2222:22'
    volumes:
      - '$GITLAB_HOME/config:/etc/gitlab'
      - '$GITLAB_HOME/logs:/var/log/gitlab'
      - '$GITLAB_HOME/data:/var/opt/gitlab'
    shm_size: '256m'
    networks:
      my_network:
        aliases:
          - your.domain.com

networks:
  my_network:
    driver: bridge